    <circle cx="1065" cy="18" r="106" fill="#c1c978" opacity=".4"/>
    <circle cx="1065" cy="18" r="105" fill="url(#ball)" filter="url(#felt)"/>
    <path d="M1000-77Q1102-1 1000 98M1130-77Q1028-1 1130 98" fill="none" stroke="#48512a" stroke-opacity=".5" stroke-width="8"/>
