<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="base" x2="1" y2="1"><stop stop-color="#123f35"/><stop offset=".6" stop-color="#082b26"/><stop offset="1" stop-color="#122d2b"/></linearGradient>
    <radialGradient id="clay"><stop stop-color="#c3753e" stop-opacity=".65"/><stop offset="1" stop-color="#c3753e" stop-opacity="0"/></radialGradient>
    <radialGradient id="ball" cx=".28" cy=".22" r=".8"><stop stop-color="#e4e998"/><stop offset=".35" stop-color="#b6bf54"/><stop offset=".7" stop-color="#808e36"/><stop offset="1" stop-color="#394b20"/></radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ad5734" stop-opacity="0"/><stop offset=".45" stop-color="#ad5734" stop-opacity=".6"/><stop offset="1" stop-color="#c27248"/></linearGradient>
    <filter id="felt" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="17" result="fibers"/>
      <feColorMatrix in="fibers" type="saturate" values="0"/>
      <feComposite in2="SourceGraphic" operator="in" result="clippedFibers"/>
      <feBlend in="SourceGraphic" in2="clippedFibers" mode="soft-light"/>
    </filter>
    <filter id="grit" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".42" numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComposite in2="SourceGraphic" operator="in" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="soft-light"/>
    </filter>
    <pattern id="dust" width="37" height="43" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1.5" fill="#cf8750" opacity=".5"/><circle cx="27" cy="32" r="1" fill="#e5b77b" opacity=".5"/><circle cx="16" cy="19" r="2" fill="#b46436" opacity=".35"/></pattern>
    <pattern id="strings" width="23" height="23" patternUnits="userSpaceOnUse"><path d="M0 0H23M0 0V23" stroke="#accaba" stroke-opacity=".18" stroke-width="1.5"/></pattern>
  </defs>
  <path fill="url(#base)" d="M0 0H1080V1920H0Z"/>
  <g fill="none" stroke="#9abdab" stroke-opacity=".1" stroke-width="8" transform="rotate(-24 300 600)"><path d="M-80-200H560V2100H-80Z M-15-200V2100 M495-200V2100 M-15 650H495 M-15 1250H495 M240 650V1250"/></g>
  <ellipse cx="1030" cy="1880" rx="470" ry="260" fill="url(#clay)"/>
  <ellipse cx="20" cy="1910" rx="550" ry="210" fill="url(#clay)"/>
  <path d="M0 1680Q145 1770 350 1830T800 1820Q950 1750 1080 1690V1920H0Z" fill="url(#earth)" filter="url(#grit)"/>
  <path d="M0 1760Q500 1960 1080 1760V1920H0Z M990 0H1080V720L1050 420Z" fill="url(#dust)" opacity=".7"/>
  <path d="M-70 1790L130 1940" stroke="#eee2c8" stroke-width="14" opacity=".45"/>
  <path d="M-70 1805L130 1955" stroke="#693a28" stroke-width="3" opacity=".25"/>
